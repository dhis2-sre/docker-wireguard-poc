services:
  cert-generator:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache openssl &&
      mkdir -p /certs &&
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /certs/app2-91-108-122-249.nip.io.key
      -out /certs/app2-91-108-122-249.nip.io.crt
      -subj '/CN=app2-91-108-122-249.nip.io'"
    volumes:
      - certs:/certs

  traefik:
    image: traefik:v3.5.0
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=your-email@dhis2.org"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./letsencrypt:/letsencrypt
      - certs:/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  app1:
    image: nginx:alpine

  app2:
    image: nginx:alpine

volumes:
  certs:
