http:
  routers:
    grafana:
      rule: Host(`grafana.internal`)
      entryPoints:
        - web
        - websecure
      service: grafana
      tls: {}
    app:
      rule: Host(`app-91-108-122-249.nip.io`)
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: app
    app-redirect:
      rule: Host(`app-91-108-122-249.nip.io`)
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: app

  services:
    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
    app:
      loadBalancer:
        servers:
          - url: http://app:80

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

tls:
  certificates:
    - certFile: /etc/traefik/certs/internal.crt
      keyFile: /etc/traefik/certs/internal.key
      stores:
        - default
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/internal.crt
        keyFile: /etc/traefik/certs/internal.key
